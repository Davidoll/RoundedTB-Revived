name: build

# CI 默认禁用:不随 push / pull_request 自动运行,只在 Actions 页面手动
# "Run workflow" 时才构建(避免每次推送都触发一轮 Windows 构建)。
#
# 若将来要恢复自动触发,把下面的 workflow_dispatch 块换成:
#   on:
#     push:
#     pull_request:
# 注意:换成自动触发后 inputs.* 为空,下面已用 `|| '默认值'` 兜底,无需改其他地方。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version string, e.g. R5.0'
        required: false
        default: 'R5.0'
      channel:
        description: 'Build channel: master / dev / canary'
        required: false
        default: 'master'

jobs:
  build:
    name: build-windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        # 项目目标框架已从 net8.0 升到 net10.0(R5),SDK 必须同步,否则还原/编译失败。
        dotnet-version: '10.0.x'

    - name: Build Release
      # 必须显式指定 Channel,否则 csproj 默认编成 Canary(带调试日志开关)。
      run: dotnet build RoundedTB/RoundedTB.csproj -c Release -p:Channel=${{ inputs.channel || 'master' }}

    - name: Add commit hash to output folder
      shell: pwsh
      run: |
        Rename-Item -Path ".\RoundedTB\RoundedTB\bin\Release\net10.0-windows10.0.19041" -NewName "RoundedTB-$(git rev-parse --short ${{ github.sha }})"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rtb-artifacts
        path: |
          .\RoundedTB\RoundedTB\bin\Release\RoundedTB-*\

  installers:
    name: build-installers
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Inno Setup
      shell: pwsh
      run: |
        $isDir = "C:\tools\innosetup"
        New-Item -ItemType Directory -Force -Path $isDir | Out-Null
        $installer = "C:\tools\innosetup-7.1.0-x64.exe"
        Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
        & $installer /VERYSILENT /NORESTART /DIR=$isDir
        if (-not (Test-Path "$isDir\ISCC.exe")) { throw "ISCC.exe not found after install" }
        Write-Host "Inno Setup installed at $isDir"

    - name: Build installers (all archs, SC + FD)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ver = "${{ inputs.version || 'R5.0' }}"
        $channel = "${{ inputs.channel || 'master' }}"
        $iscc = "C:\tools\innosetup\ISCC.exe"
        $staging = Join-Path $env:RUNNER_TEMP "staging"
        $out = Join-Path $env:RUNNER_TEMP "installers"
        New-Item -ItemType Directory -Force -Path $out | Out-Null
        $arches = @("x86","x64","arm64")
        foreach ($a in $arches) {
          foreach ($sc in @($false,$true)) {
            $tag = if ($sc) { "sc" } else { "fd" }
            $pubDir = Join-Path $staging "win-$a-$tag"
            $fdFlag = if ($sc) { "false" } else { "true" }
            Write-Host "::group::publish win-$a ($tag)"
            dotnet publish "RoundedTB\RoundedTB.csproj" -c Release -r "win-$a" `
              --self-contained $sc -p:Channel=$channel -o $pubDir -v minimal
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for win-$a-$tag" }
            Write-Host "::endgroup::"
            Write-Host "::group::ISCC win-$a ($tag)"
            & $iscc "/DPubDir=$pubDir" "/DVersion=$ver" "/DArch=$a" "/DFrameworkDependent=$fdFlag" "Installer\RoundedTB.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for win-$a-$tag" }
            Write-Host "::endgroup::"
            $suffix = if ($sc) { "" } else { "-framework-dependent" }
            $produced = "Installer\output\RoundedTB-$ver-win-$a$suffix-setup.exe"
            Move-Item -Force $produced (Join-Path $out "RoundedTB-$ver-win-$a$suffix-setup.exe")
          }
        }
        Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Upload installer artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rtb-installers
        path: |
          ${{ runner.temp }}\installers\*-setup.exe
